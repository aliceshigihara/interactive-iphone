<!doctype html>
<html lang="pt-BR" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Crie histórias que acontecem na tela de um iPhone. Monte conversas, perfis e ligações e compartilhe a sua história.">
  <meta name="theme-color" content="#f4f8ff">
  <title>Fablyphone — Histórias em uma tela</title>
  <script>
    if (new URLSearchParams(location.search).get('reader') === '1') {
      location.replace('editor.html' + location.search + location.hash);
    }
    try {
      if (localStorage.getItem('fablyphone:landing-theme') === 'dark') document.documentElement.dataset.theme = 'dark';
    } catch {}
  </script>
  <link rel="preload" href="assets/roboto-flex-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="landing.css">
  <link rel="stylesheet" href="theme-toggle.css">
  <script src="theme-toggle.js" defer></script>
  <script src="landing.js" defer></script>
</head>
<body>
  <div class="scanner" aria-hidden="true"><canvas id="scanner"></canvas></div>
  <header class="site-head">
    <a class="brand" href="./" aria-label="Fablyphone · início"><span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none"><rect x="7" y="3.5" width="10" height="17" rx="3"/><path d="M10 6h4m-2 11.5h.01"/></svg></span>fablyphone</a>
    <nav aria-label="Navegação da página"><button id="theme-toggle" class="theme-toggle theme-switch" data-theme-toggle="fablyphone:landing-theme" type="button" aria-label="Modo escuro" aria-pressed="false"><svg class="theme-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.4 14.5a8.8 8.8 0 0 1-10.9-10.9 8.8 8.8 0 1 0 10.9 10.9Z"/></svg><svg class="theme-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.5 1.5m11 11L19 19m0-14-1.5 1.5m-11 11L5 19"/></svg></button></nav>
  </header>
  <main>
    <section class="hero" aria-labelledby="hero-title">
      <h1 id="hero-title" class="pressure">fablyphone</h1>
      <p class="hero-copy">Crie histórias que acontecem na tela de um iPhone.</p>
    </section>
    <section class="tools" aria-label="Prévias do Fablyphone">
      <div id="tool-deck" class="card-swap" role="region" aria-roledescription="carrossel" aria-label="Prévias do Fablyphone" tabindex="0">
        <div class="card-swap-sizer" aria-hidden="true"><span></span></div>
        <div class="card-swap-stage">
          <div class="card-swap-slot" data-swap-index="0">
            <button type="button" class="tool-card card-swap-card card-profiles" data-title="Redes sociais" data-copy="Crie perfis, posts e conversas fictícias no Instagram e no Twitter." aria-label="Redes sociais">
              <span class="tool-label card-swap-head"><span class="card-swap-icon"><img src="assets/iphone-icons/Instagram.png" alt=""></span><span class="card-swap-title">Redes sociais</span></span>
              <span class="card-art card-swap-media" aria-hidden="true"><span class="mini-social"><span class="mini-social-top"><img src="assets/iphone-icons/Instagram.png" alt="" width="22" height="22"><b>Perfil</b></span><span class="mini-account"><i></i><span><b>@zhang</b><small>Diário da viagem</small></span></span><span class="mini-instagrid"><i></i><i></i><i></i></span></span></span>
              <span class="card-swap-card-rim" aria-hidden="true"></span>
            </button>
            <span class="card-swap-shade" aria-hidden="true"></span>
          </div>
          <div class="card-swap-slot" data-swap-index="1">
            <button type="button" class="tool-card card-swap-card card-messages" data-title="Conversas" data-copy="Escreva mensagens e adicione fotos às conversas dos seus personagens." aria-label="Conversas">
              <span class="tool-label card-swap-head"><span class="card-swap-icon"><img src="assets/iphone-icons/com.apple.MobileSMS-large.png" alt=""></span><span class="card-swap-title">Conversas</span></span>
              <span class="card-art card-swap-media" aria-hidden="true"><span class="mini-messages"><span class="mini-chat-top"><i>Z</i><b>Zhang</b></span><span class="bubble">Já chegou?</span><span class="bubble mine">Tô quase aí.</span><span class="bubble">Vai valer a espera.</span><span class="mini-input">iMessage <b>↑</b></span></span></span>
              <span class="card-swap-card-rim" aria-hidden="true"></span>
            </button>
            <span class="card-swap-shade" aria-hidden="true"></span>
          </div>
          <div class="card-swap-slot" data-swap-index="2">
            <button type="button" class="tool-card card-swap-card card-calls" data-title="Ligações interativas" data-copy="Programe chamadas fictícias, escreva as falas e escolha quando o telefone toca." aria-label="Ligações interativas">
              <span class="tool-label card-swap-head"><span class="card-swap-icon"><img src="assets/iphone-icons/com.apple.mobilephone-large.png" alt=""></span><span class="card-swap-title">Ligações interativas</span></span>
              <span class="card-art card-swap-media" aria-hidden="true"><span class="mini-call"><small>Chamada recebida</small><b>Zhang</b><span class="call-slider"><span>‹</span><i><svg viewBox="0 0 24 24" fill="none"><path d="M7 3h3l2 4-2 2c1 2.2 2.8 4 5 5l2-2 4 2v3c0 2-2 3-4 2C10 17.6 5.7 13.3 4 7c-1-2 0-4 3-4Z"/></svg></i><span>›</span></span></span></span>
              <span class="card-swap-card-rim" aria-hidden="true"></span>
            </button>
            <span class="card-swap-shade" aria-hidden="true"></span>
          </div>
          <div class="card-swap-slot" data-swap-index="3">
            <button type="button" class="tool-card card-swap-card card-notices" data-title="Narração interativa" data-copy="Faça mensagens e notificações aparecerem no momento certo da leitura." aria-label="Narração interativa">
              <span class="tool-label card-swap-head"><span class="card-swap-icon"><img src="assets/iphone-icons/com.apple.mobilenotes-large.png" alt=""></span><span class="card-swap-title">Narração interativa</span></span>
              <span class="card-art card-swap-media" aria-hidden="true"><span class="mini-notices"><span class="mini-clock">9:41</span><span class="mini-notice"><img src="assets/iphone-icons/com.apple.MobileSMS-large.png" alt="" width="20" height="20"><span><b>Zhang</b><small>Encontrei uma pista.</small></span></span><span class="mini-notice"><img src="assets/iphone-icons/com.apple.mobilenotes-large.png" alt="" width="20" height="20"><span><b>Notes</b><small>Dia um</small></span></span></span></span>
              <span class="card-swap-card-rim" aria-hidden="true"></span>
            </button>
            <span class="card-swap-shade" aria-hidden="true"></span>
          </div>
          <div class="card-swap-slot" data-swap-index="4">
            <button type="button" class="tool-card card-swap-card card-share" data-title="Links de leitura" data-copy="Publique uma cópia da sua história para outras pessoas explorarem." aria-label="Links de leitura">
              <span class="tool-label card-swap-head"><span class="card-swap-icon"><img src="assets/iphone-icons/com.apple.mobilesafari-large.png" alt=""></span><span class="card-swap-title">Links de leitura</span></span>
              <span class="card-art card-swap-media" aria-hidden="true"><span class="mini-share"><span class="mini-share-icon"><svg viewBox="0 0 24 24" fill="none"><path d="M12 15V3m-4 4 4-4 4 4M5 12v8h14v-8"/></svg></span><b>O outro lado</b><small>Uma história de Zhang</small><span class="mini-link">↗ Abrir história</span></span></span>
              <span class="card-swap-card-rim" aria-hidden="true"></span>
            </button>
            <span class="card-swap-shade" aria-hidden="true"></span>
          </div>
        </div>
      </div>
      <span class="sr-only" id="tool-status" aria-live="polite"></span>
    </section>
    <div class="start"><a class="ripple-button" id="start-link" href="./editor.html"><span>Começar</span></a></div>
  </main>
  <footer class="site-foot"><span>Fablyphone</span><span>Um iPhone fictício para as suas histórias.</span></footer>
</body>
</html>
